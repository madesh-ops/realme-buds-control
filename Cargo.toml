[package]
name = "t310_control"
version = "0.1.0"
edition = "2024"
description = "Control app for realme Buds T310 on Windows: noise control, EQ, battery and codec"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }

[profile.release]
opt-level = 3
lto = true
strip = true

[build-dependencies]
winresource = "0.1"
